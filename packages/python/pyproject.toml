[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "product-attribute-saturation"
version = "0.1.0"
description = "Exact occupancy calculations accompanying the template research paper"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Khondoker Ahnaf Prio" }]

[project.urls]
Repository = "https://github.com/ahnafyy/autonomous-discovery-product-attribute-saturation"
Paper = "https://ahnafyy.github.io/autonomous-discovery-product-attribute-saturation/"

[tool.hatch.build.targets.wheel]
packages = ["src/product_attribute_saturation"]
